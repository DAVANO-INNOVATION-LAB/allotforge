name: Validate native admission
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  kubernetes-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - uses: helm/kind-action@v1
        with:
          cluster_name: davano-ci
          node_image: kindest/node:v1.31.4
      - run: python scripts/verify_native_admission.py
        env:
          DAVANO_TEST_CONTEXT: kind-davano-ci
      - name: Render deployment variants
        run: |
          for directory in deploy/base deploy/overlays/live-readonly deploy/overlays/persistent deploy/overlays/openshift deploy/operator deploy/operator-openshift deploy/control-api; do
            kubectl kustomize "$directory" > /tmp/davano-rendered.yaml
          done
      - name: Server-validate operator templates
        run: |
          kubectl --context kind-davano-ci apply -f deploy/operator/namespace.yaml
          kubectl --context kind-davano-ci apply --dry-run=server -k deploy/operator
          kubectl --context kind-davano-ci apply --dry-run=server -k deploy/control-api
