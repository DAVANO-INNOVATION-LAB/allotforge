name: Validate Kueue generated resources
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  kueue-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAVANO_KUEUE_API_VERSION: v1beta2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Create dedicated disposable CPU-only cluster
        id: kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          version: v0.33.0
          node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          kubectl_version: v1.34.11
          cluster_name: allotforge-acceptance
          kubeconfig: ${{ runner.temp }}/allotforge-kind.yaml
          wait: 120s
      - name: Bind private configuration to this disposable instance
        shell: bash
        env:
          KIND_CONFIG: ${{ runner.temp }}/allotforge-kind.yaml
          PRIVATE_CONFIG: ${{ runner.temp }}/allotforge-kind.json
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$PRIVATE_CONFIG"
          kubectl --kubeconfig "$KIND_CONFIG" config view --raw -o json > "$PRIVATE_CONFIG"
          chmod 600 "$PRIVATE_CONFIG"
          python - <<'PY'
          import json, os
          from urllib.parse import urlsplit
          with open(os.environ['PRIVATE_CONFIG']) as stream:
              config = json.load(stream)
          assert config['current-context'] == 'kind-allotforge-acceptance'
          assert len(config['clusters']) == len(config['contexts']) == len(config['users']) == 1
          target = urlsplit(config['clusters'][0]['cluster']['server'])
          assert target.scheme == 'https' and target.hostname == '127.0.0.1' and target.port
          assert not target.username and not target.password and not target.path and not target.query and not target.fragment
          PY
          test "$(kind get nodes --name allotforge-acceptance)" = allotforge-acceptance-control-plane
          kubectl --kubeconfig "$PRIVATE_CONFIG" --context kind-allotforge-acceptance --request-timeout=10s get --raw /version | python -c 'import json,sys; assert json.load(sys.stdin)["gitVersion"] == "v1.34.11"'
          kubectl --kubeconfig "$PRIVATE_CONFIG" --context kind-allotforge-acceptance --request-timeout=10s label namespace kube-system allotforge.dev/disposable=cluster-acceptance
      - name: Verify and install the pinned official Kueue artifact
        shell: bash
        env:
          PRIVATE_CONFIG: ${{ runner.temp }}/allotforge-kind.json
          PINNED_MANIFEST: ${{ runner.temp }}/allotforge-kueue.yaml
        run: |
          set -euo pipefail
          python scripts/prepare_kueue_acceptance.py --download --output "$PINNED_MANIFEST"
          kubectl --kubeconfig "$PRIVATE_CONFIG" --context kind-allotforge-acceptance --request-timeout=30s apply --server-side --field-manager=allotforge-acceptance-install -f "$PINNED_MANIFEST"
          kubectl --kubeconfig "$PRIVATE_CONFIG" --context kind-allotforge-acceptance --request-timeout=30s -n kueue-system rollout status deployment/kueue-controller-manager --timeout=180s
      - name: Exercise generated-resource compatibility without GPU execution
        shell: bash
        env:
          PRIVATE_CONFIG: ${{ runner.temp }}/allotforge-kind.json
          REPORT: ${{ runner.temp }}/allotforge-acceptance-evidence.json
        run: |
          set -euo pipefail
          server=$(python -c 'import json,os; print(json.load(open(os.environ["PRIVATE_CONFIG"]))["clusters"][0]["cluster"]["server"])')
          uid=$(kubectl --kubeconfig "$PRIVATE_CONFIG" --context kind-allotforge-acceptance --request-timeout=10s get namespace kube-system -o jsonpath='{.metadata.uid}')
          run_id=$(python -c 'import hashlib,os; print(hashlib.sha256((os.environ["GITHUB_RUN_ID"]+"."+os.environ["GITHUB_RUN_ATTEMPT"]).encode()).hexdigest()[:12])')
          python -m acceptance.cluster --execute --context kind-allotforge-acceptance \
            --kubeconfig-json "$PRIVATE_CONFIG" --expected-server "$server" \
            --expected-kube-system-uid "$uid" --expected-kubernetes-version v1.34.11 \
            --run-id "$run_id" --evidence "$REPORT"
      - name: Destroy the dedicated cluster and verify absence
        if: always() && steps.kind.outcome == 'success'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s kind delete cluster --name allotforge-acceptance --kubeconfig "${{ runner.temp }}/allotforge-kind.yaml"
          clusters=$(kind get clusters)
          if printf '%s\n' "$clusters" | grep -Fxq allotforge-acceptance; then
            echo 'Dedicated acceptance cluster still exists; teardown is not verified.'
            exit 1
          fi
          echo 'Dedicated acceptance cluster absence verified.'
      - name: Preserve only sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: allotforge-kueue-acceptance
          path: ${{ runner.temp }}/allotforge-acceptance-evidence.json
          if-no-files-found: ignore
          retention-days: 14

