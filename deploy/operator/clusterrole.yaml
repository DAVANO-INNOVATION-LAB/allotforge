apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: davano-controller
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - namespaces
  verbs:
  - get
  - list
- apiGroups:
  - fleet.davano.io
  resources:
  - gpupools
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - fleet.davano.io
  resources:
  - gpupools/status
  verbs:
  - get
  - update
- apiGroups:
  - fleet.davano.io
  resources:
  - gpuaccesspolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - resourceflavors
  - clusterqueues
  verbs:
  - get
  - list
  - create
  - update
  - delete
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingadmissionpolicies
  - validatingadmissionpolicybindings
  verbs:
  - get
  - list
  - create
  - update
  - delete
