apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpuaccesspolicies.fleet.davano.io
spec:
  group: fleet.davano.io
  scope: Namespaced
  names:
    kind: GPUAccessPolicy
    plural: gpuaccesspolicies
    singular: gpuaccesspolicy
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - poolRef
            - gpuQuota
            - maxGPUsPerPod
            - subjects
            properties:
              poolRef:
                type: string
                maxLength: 63
                pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Pool reference is immutable
              gpuQuota:
                type: integer
                minimum: 0
                maximum: 100000
              maxGPUsPerPod:
                type: integer
                minimum: 1
                maximum: 1024
              subjects:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: object
                  required:
                  - kind
                  - name
                  properties:
                    kind:
                      type: string
                      enum:
                      - User
                      - Group
                      - ServiceAccount
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: ^[^\s]+$
                    namespace:
                      type: string
                      maxLength: 63
                      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                  x-kubernetes-validations:
                  - rule: self.kind != 'Group' || !(self.name in ['system:authenticated',
                      'system:unauthenticated'])
                    message: Broad system groups are forbidden
                  - rule: self.kind != 'User' || !self.name.startsWith('system:')
                    message: System users are forbidden
                  - rule: self.kind == 'ServiceAccount' || !has(self.namespace)
                    message: Only ServiceAccounts have namespaces
                description: Requested subjects only. Automatic workload grants are
                  disabled in this release; this field confers no RBAC permissions.
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              enforcement:
                type: string
                enum:
                - pending
                - kubernetes-native
              lastReconcileTime:
                type: string
                format: date-time
              queueName:
                type: string
              clusterQueueName:
                type: string
              managedResources:
                type: array
                items:
                  type: object
                  required:
                  - kind
                  - name
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    reason:
                      type: string
                    message:
                      type: string
                      maxLength: 1024
                    observedGeneration:
                      type: integer
                      format: int64
                    lastTransitionTime:
                      type: string
                      format: date-time
              workloadGrants:
                type: string
                enum:
                - disabled
                - revocation-pending
