apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: davano-controller
  namespace: tenant-example
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - resourcequotas
  verbs:
  - get
  - list
  - create
  - update
  - delete
- apiGroups:
  - fleet.davano.io
  resources:
  - gpuaccesspolicies
  verbs:
  - get
  - update
- apiGroups:
  - fleet.davano.io
  resources:
  - gpuaccesspolicies/status
  verbs:
  - get
  - update
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - localqueues
  verbs:
  - get
  - list
  - create
  - update
  - delete
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - get
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: davano-controller
  namespace: tenant-example
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: davano-controller
subjects:
- kind: ServiceAccount
  name: davano-controller
  namespace: davano
